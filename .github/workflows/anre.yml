name: ANRE page watch

on:
  schedule:
    - cron: "41 6 * * *"        # daily
  workflow_dispatch:

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install requests sqlalchemy "psycopg[binary]" pyyaml
      - name: Hash the page and alert the team on change
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          ANRE_WATCH_URL: ${{ vars.ANRE_WATCH_URL }}
          TEAM_NTFY_TOPIC: ${{ secrets.TEAM_NTFY_TOPIC }}
        run: python -m jobs.anre_watch
