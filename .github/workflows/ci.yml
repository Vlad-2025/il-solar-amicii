name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-ron poppler-utils
      - run: pip install -r requirements.txt pytest ruff
      - run: ruff check --select E,F,W,B --ignore E501,B008 .
      - run: pytest -q
